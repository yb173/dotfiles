# .github/workflows/actions.lock がワークフローと食い違っているか、
# 固定したコミットが upstream で検証できなくなったときに失敗する
# https://github.com/github/gh-actions-lock/blob/main/.github/workflows/verify-lockfile.yml

name: Verify lockfile

on:
  - pull_request

jobs:
  verify:
    name: Verify actions lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # gh-actions-lock 自体はバージョンを固定せず、常に最新版を使う
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock

      - name: Verify lockfile
        run: gh actions-lock --verify
