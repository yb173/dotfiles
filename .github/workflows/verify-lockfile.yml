# .github/workflows/actions.lock がワークフローと食い違っているとき、または
# 固定したコミットが upstream で検証できなくなったときに失敗する
# https://github.com/github/gh-actions-lock/blob/main/.github/workflows/verify-lockfile.yml

name: Verify lockfile

on:
  pull_request:
  # マージしたあとの main も確かめる
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify actions lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # gh-actions-lock の公式の verify アクション。チェックサムを確かめた CLI で gh actions-lock --verify を実行する
      # CLI の版はタグ（verify/v*）で決まり、Dependabot がタグと actions.lock を上げる
      - name: Verify lockfile
        uses: github/gh-actions-lock@verify/v0.5.1
