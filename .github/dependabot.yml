version: 2
updates:
  # GitHub Actions のマイナー版・パッチ版を上げる PR を、週に 1 回作る。
  # actions.lock も同じ PR で更新する。verify-lockfile が使う gh-actions-lock（github/gh-actions-lock@verify/v*）も、ここで上がる
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
    # メジャー版は PR にしない。使い方が変わることがあるので、リリースノートを読んでから手で上げる（README の「版を上げる」）
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
