# starship（プロンプト）の設定。書いていないものは既定のまま。項目は https://starship.rs/config/

# starship が node --version などのコマンドを待つ時間の上限（ミリ秒）。既定の 500 では、Mac が混んでいるときに
# node の起動が間に合わず、警告が出て、node の版も出ないことがあった。普段は 20ms ほどで終わるので、待つ時間は増えない
command_timeout = 1000

# Google Cloud のアカウントを出さない。既定では、gcloud にログインしていると、どのディレクトリでも
# メールアドレスが出る。今のアカウントは gcloud config list で見る
[gcloud]
disabled = true

# package.json・Cargo.toml などがあるディレクトリで、そのパッケージの版（📦 v1.0.0）を出さない。
# node などの言語の版（via ⬢ v26.13.1）は出す
[package]
disabled = true

# AWS のリージョン（☁️  (ap-northeast-1)）を出さない。既定の format からリージョンの部分 (\($region\) ) を除いた。
# プロフィールと、一時的な認証情報の残り時間は出す。全体を ( ) で囲み、どちらもなければ記号も出さない
[aws]
format = '(on [$symbol($profile )(\[$duration\] )]($style))'

# 以下は Nerd Font の文字を記号に使わないための設定（starship preset no-nerd-font の中身）。
# Nerd Font の文字を持たないフォントのターミナル（VS Code の MyricaM など）では、四角になってしまうため
[azure]
symbol = "☁️ "

[battery]
full_symbol = "• "
charging_symbol = "⇡ "
discharging_symbol = "⇣ "
unknown_symbol = "❓ "
empty_symbol = "❗ "

[erlang]
symbol = "ⓔ "

[nodejs]
symbol = "[⬢](bold green) "

[pulumi]
symbol = "🧊 "
